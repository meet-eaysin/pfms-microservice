services:
  # Kong Gateway Database
  kong-db:
    image: postgres:16-alpine
    container_name: pfms_kong_db
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: ${KONG_DB_PASSWORD:-placeholder_kong_db_password}
      POSTGRES_DB: kong
    volumes:
      - kong_db_data:/var/lib/postgresql/data
    networks:
      - pfms_network

  # Kong Gateway
  kong:
    image: kong:latest
    container_name: pfms_kong
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - '8000:8000'
    volumes:
      - ../../apps/api-gateway/dist/kong-dev.yaml:/kong/declarative/kong.yml
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - kong-db
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pfms_network

  # Konga - Kong GUI
  konga:
    image: pantsel/konga:latest
    container_name: pfms_konga
    environment:
      NODE_ENV: development
      DB_ADAPTER: postgres
      DB_HOST: kong-db
      DB_USER: kong
      DB_PASSWORD: ${KONG_DB_PASSWORD:-placeholder_kong_db_password}
      DB_DATABASE: kong
    depends_on:
      - kong-db
      - kong
    networks:
      - pfms_network

  # Portainer - Container Management
  portainer:
    image: portainer/portainer-ce:latest
    container_name: pfms_portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - pfms_network

  # Mailhog - Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: pfms_mailhog
    ports:
      - '8025:8025'
    networks:
      - pfms_network

  # Backup Utility
  backup:
    image: postgres:16-alpine
    container_name: pfms_backup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ../backups:/backups
    command: |
      sh -c '
        echo "Starting backup..."
        pg_dump -h postgres-auth -U postgres auth_db | gzip > /backups/auth_db_$$(date +%Y%m%d_%H%M%S).sql.gz
        pg_dump -h postgres-expense -U postgres expense_db | gzip > /backups/expense_db_$$(date +%Y%m%d_%H%M%S).sql.gz
        pg_dump -h postgres-user -U postgres user_db | gzip > /backups/user_db_$$(date +%Y%m%d_%H%M%S).sql.gz
        echo "Backup completed."
      '
    networks:
      - pfms_network

networks:
  pfms_network:

volumes:
  kong_db_data:
  portainer_data:
